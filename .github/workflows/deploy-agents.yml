name: Deploy Agents

# The agentic layer: the three MCP tool Lambdas, and the two AgentCore runtimes
# that Step 3 (canvas) and Step 4 (IaC) call.
#
# This exists because the agents were the one part of the estate that had no CI
# path at all. Everything else moved to Terraform plus Actions during the
# account migration; the agents stayed a laptop script, so when the account
# changed they simply did not come with it. Rebuilding them by hand is how they
# get missed a second time.
#
# The MCP job runs first and on its own, because the AgentCore gateway targets
# the Lambda ARNs it prints. Both jobs are idempotent: re-running creates what
# is absent and updates what is present.

on:
  push:
    branches: [main]
    # Only the Lambda sources. The AgentCore job is dispatch-only, so a push
    # touching backend/agents/** has nothing to run here, and listing it made
    # every agent-code change rebuild three container images for nothing.
    paths:
      - 'backend/mcp/**'
      - '.github/workflows/deploy-agents.yml'
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        required: true
        default: mcp
        type: choice
        options: [mcp, agentcore, both]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

concurrency:
  group: deploy-agents
  cancel-in-progress: false

jobs:
  mcp:
    name: MCP tool Lambdas
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'agentcore'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # The Terraform role, not the deploy role. The deploy role can push
          # to exactly one ECR repository and cannot touch Lambda or IAM, which
          # is correct for a container restart and useless here.
          role-to-assume: ${{ secrets.GH_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy the MCP Lambdas
        working-directory: backend/mcp
        run: ./deploy_mcp.sh

      - name: Publish the Lambda ARNs
        working-directory: backend/mcp
        run: |
          set -euo pipefail
          # deploy_mcp.sh writes arns.env. Park the ARNs in SSM so the
          # AgentCore job, and a human reading the console, can find them
          # without re-deriving them from the account id.
          while IFS='=' read -r KEY VALUE; do
            [ -z "${KEY:-}" ] && continue
            # CLYRO_MCP_PRICING_ARN -> /clyro/prod/mcp/pricing
            NAME=$(echo "$KEY" | sed 's/^CLYRO_MCP_//; s/_ARN$//' | tr 'A-Z' 'a-z')
            aws ssm put-parameter \
              --name "/clyro/prod/mcp/${NAME}" \
              --value "$VALUE" --type String --overwrite >/dev/null
            echo "published /clyro/prod/mcp/${NAME}"
          done < arns.env

      - name: Smoke-test each Lambda
        run: |
          set -euo pipefail
          # A Lambda that deploys but cannot be invoked is not deployed. This
          # only proves the image starts and the runtime answers; the tool
          # contract itself is exercised by the wizard tests.
          FAILED=0
          for NAME in pricing cfn docs; do
            FN="clyro-mcp-${NAME}"
            printf '%-24s ' "$FN"
            if aws lambda invoke --function-name "$FN" \
                 --payload '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
                 --cli-binary-format raw-in-base64-out \
                 /tmp/out.json >/tmp/meta.json 2>/tmp/err.txt; then
              if grep -q FunctionError /tmp/meta.json; then
                echo "invoked but the handler errored"
                head -c 400 /tmp/out.json; echo
                FAILED=1
              else
                echo "ok"
              fi
            else
              echo "invoke failed"
              head -c 400 /tmp/err.txt; echo
              FAILED=1
            fi
          done
          exit $FAILED

  agentcore:
    name: AgentCore runtimes
    if: github.event_name == 'workflow_dispatch' && inputs.target != 'mcp'
    # Not `needs: [mcp]`: that would skip this job whenever the MCP job is
    # skipped, which is exactly the agentcore-only case the input exists for.
    # The gateway targets read the Lambda ARNs from SSM, so an MCP deploy is a
    # prerequisite in fact but not in this run.
    runs-on: ubuntu-latest
    environment: prod

    strategy:
      # One project at a time. They share the MCP Lambdas as gateway targets,
      # and two concurrent CDK deploys touching the same targets is a race for
      # no gain: the whole thing is a few minutes.
      max-parallel: 1
      matrix:
        project: [CryloCanvas, CryloIac]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The CodeZip build resolves the runtime's Python dependencies for its
      # own platform (aarch64-manylinux2014) with uv, which the runner does not
      # ship. Without it synthesis dies as "uv install failed ... exit code
      # null", which reads like a packaging error rather than a missing binary.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Materialise the project config
        working-directory: backend/agents/${{ matrix.project }}/agentcore
        run: |
          set -euo pipefail
          # agentcore.json and aws-targets.json are gitignored because they
          # carry the AWS account id, and the repository should not. They are
          # not secret though, only account-specific, so CI rebuilds them from
          # the committed template using the identity it is already running as.
          # That is what stops the agent deploy from being something only one
          # laptop can do.
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed "s/<ACCOUNT_ID>/${ACCOUNT_ID}/g" agentcore.json.example > agentcore.json

          cat > aws-targets.json <<JSON
          [
            {
              "name": "prod",
              "description": "Clyro production, ${AWS_REGION}",
              "account": "${ACCOUNT_ID}",
              "region": "${AWS_REGION}"
            }
          ]
          JSON

          # Fail here rather than three minutes into a CDK synth.
          grep -q '<ACCOUNT_ID>' agentcore.json && {
            echo "::error::agentcore.json still contains a placeholder"; exit 1; }
          echo "config written for account ending ${ACCOUNT_ID: -4}"

      - name: Install and build the CDK app
        working-directory: backend/agents/${{ matrix.project }}/agentcore/cdk
        run: |
          npm ci
          npm run build

      - name: Deploy
        working-directory: backend/agents/${{ matrix.project }}/agentcore/cdk
        run: |
          set -euo pipefail

          # List first. `cdk deploy --all` against an app that synthesizes zero
          # stacks prints nothing and exits 0, so the first attempt looked like
          # a successful deploy that created no resources. Assert there is
          # something to deploy before claiming to deploy it.
          echo "--- stacks the app synthesizes ---"
          npx cdk list 2>&1 | tee /tmp/stacks.txt
          if [ ! -s /tmp/stacks.txt ]; then
            echo "::error::The CDK app synthesized no stacks. Check that"
            echo "agentcore.json and aws-targets.json were written next to cdk/,"
            echo "and that agentcore.json lists at least one runtime."
            exit 1
          fi

          npx cdk deploy --all --require-approval never --progress events

      - name: Publish the runtime ARNs
        run: |
          set -euo pipefail
          # Django reads these as settings, and /clyro/prod/env/ is exported
          # verbatim into the container by /opt/clyro/up.sh, so publishing them
          # here is the whole handoff. require_runtime_arn has no fallback, so
          # until these exist Step 3 and Step 4 raise ImproperlyConfigured.
          publish() {
            aws ssm put-parameter --name "$1" --value "$2" \
              --type String --overwrite >/dev/null
            echo "published $1"
          }

          list_runtime() {
            aws bedrock-agentcore-control list-agent-runtimes \
              --query "agentRuntimes[?agentRuntimeName=='$1'].agentRuntimeArn | [0]" \
              --output text
          }

          case "${{ matrix.project }}" in
            CryloCanvas)
              ARN=$(list_runtime CryloCanvas_Reasoning)
              [ "$ARN" = "None" ] && { echo "::error::Reasoning runtime not found"; exit 1; }
              publish /clyro/prod/env/REASONING_RUNTIME_ARN "$ARN"

              MEM=$(aws bedrock-agentcore-control list-memories \
                --query "memories[?starts_with(id, 'CryloCanvas')].id | [0]" --output text)
              [ "$MEM" = "None" ] && { echo "::error::CryloCanvas memory not found"; exit 1; }
              publish /clyro/prod/env/AGENTCORE_MEMORY_ID "$MEM"
              ;;
            CryloIac)
              ARN=$(list_runtime CryloIac_IacArchitect)
              [ "$ARN" = "None" ] && { echo "::error::IacArchitect runtime not found"; exit 1; }
              publish /clyro/prod/env/IAC_RUNTIME_ARN "$ARN"
              ;;
          esac

      - name: Restart the backend so it reads the new parameters
        if: matrix.project == 'CryloIac'
        run: |
          set -euo pipefail
          # The container reads /clyro/prod/env/ at start, so parameters
          # published above are invisible until it restarts. Runs once, after
          # the last project, so the box bounces a single time.
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=clyro-prod-app" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "::warning::No running instance; the ARNs are published but the app has not picked them up."
            exit 0
          fi

          CMD=$(aws ssm send-command --instance-ids "$ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["/opt/clyro/up.sh"]' \
            --query 'Command.CommandId' --output text)

          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" \
              --instance-id "$ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "restarted"; exit 0 ;;
              Failed|Cancelled|TimedOut) echo "::error::restart $STATUS"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::restart did not finish in time"; exit 1

name: Test

on:
  workflow_dispatch: {}
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        env:
          # config/settings.py reads these three with no default, so Django
          # cannot even import without them. Locally they come from
          # .env.local, which is gitignored and therefore absent here — this
          # job had never actually run before (test.yml only triggers on
          # pull_request and no PR had opened since it was added), so the gap
          # went unnoticed. Dummy values: nothing in app.tests reaches AWS.
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-only-not-a-real-secret"
          CLYRO_AWS_ACCOUNT_ID: "000000000000"
        run: python manage.py test app.tests

  frontend:
    name: Frontend lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

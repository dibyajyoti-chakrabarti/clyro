name: Scheduled - Stop Infra (9PM IST)

on:
  schedule:
    - cron: '30 15 * * *'  # 15:30 UTC = 21:00 IST
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  RDS_INSTANCE: clyro-prod-rds
  NAT_NAME_TAG: clyro-prod-nat
  ECS_CLUSTER: clyro-prod-celery-cluster
  ECS_SERVICE: clyro-prod-celery-worker

jobs:
  stop:
    name: Stop celery worker, NAT instance and RDS
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The celery worker is Fargate and bills 24/7 — it used to sit outside this
      # window entirely, which made it the most expensive always-on component.
      - name: Scale celery worker to 0
        id: ecs
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 0 \
            --query 'service.{name:serviceName,desired:desiredCount}'
          echo "✓ celery worker scaled to 0"

      # Looked up by Name tag, never by a stored instance id. A hardcoded
      # EC2_INSTANCE_ID repo secret went stale when the NAT instance was
      # replaced on 2026-07-23, and every nightly run failed with
      # InvalidInstanceID.NotFound from then on. Because that step ran first
      # under `bash -e`, the RDS stop below was never reached either, so RDS
      # billed a full 24h/day for weeks. Hence both the tag lookup and the
      # `if: always()` on every subsequent step.
      - name: Stop NAT instance if running
        id: nat
        if: always()
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NAT_NAME_TAG" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No EC2 instance tagged Name=$NAT_NAME_TAG found"
            exit 1
          fi
          echo "NAT instance: $INSTANCE_ID"

          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Current NAT instance state: $STATE"
          if [ "$STATE" = "running" ]; then
            aws ec2 stop-instances --instance-ids "$INSTANCE_ID" --query 'StoppingInstances[].CurrentState.Name'
            echo "✓ NAT instance stop initiated"
          else
            echo "NAT instance is not running — skipping (state: $STATE)"
          fi

      - name: Stop RDS if available
        id: rds
        if: always()
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_INSTANCE" \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text)
          echo "Current RDS status: $STATUS"
          if [ "$STATUS" = "available" ]; then
            aws rds stop-db-instance --db-instance-identifier "$RDS_INSTANCE" \
              --query 'DBInstance.DBInstanceStatus'
            echo "✓ RDS stop initiated"
          else
            echo "RDS is not available — skipping (status: $STATUS)"
          fi

      # `if: always()` above means individual failures no longer abort the job,
      # so re-assert them here — otherwise a broken window would go green and
      # stay unnoticed, which is exactly how the last one hid for weeks.
      - name: Fail if any stop step failed
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.ecs.outcome }}" = "failure" ] && FAILED="$FAILED ecs"
          [ "${{ steps.nat.outcome }}" = "failure" ] && FAILED="$FAILED nat"
          [ "${{ steps.rds.outcome }}" = "failure" ] && FAILED="$FAILED rds"
          if [ -n "$FAILED" ]; then
            echo "::error::stop steps failed:$FAILED"
            exit 1
          fi
          echo "✓ all stop steps succeeded"

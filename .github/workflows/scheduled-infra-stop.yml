name: Scheduled - Stop Infra (9PM IST)

on:
  schedule:
    - cron: '30 15 * * *'  # 15:30 UTC = 21:00 IST
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  RDS_INSTANCE: clyro-prod-rds

jobs:
  stop:
    name: Stop NAT instance and RDS
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop NAT instance if running
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          echo "Current NAT instance state: $STATE"
          if [ "$STATE" = "running" ]; then
            aws ec2 stop-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
            echo "✓ NAT instance stop initiated"
          else
            echo "NAT instance is not running — skipping (state: $STATE)"
          fi

      - name: Stop RDS if available
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.RDS_INSTANCE }} \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text)
          echo "Current RDS status: $STATUS"
          if [ "$STATUS" = "available" ]; then
            aws rds stop-db-instance --db-instance-identifier ${{ env.RDS_INSTANCE }}
            echo "✓ RDS stop initiated"
          else
            echo "RDS is not available — skipping (status: $STATUS)"
          fi

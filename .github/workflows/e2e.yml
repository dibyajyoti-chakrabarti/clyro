name: E2E

# Playwright against a real deployment. Dispatch-only, and not part of the push
# path, because the app instance is started and stopped by hand: a push-
# triggered run would fail on every push made while the box is off, which
# teaches everyone to ignore it.
#
# The default target is production. There is no staging environment, and a suite
# that never runs is worth less than one that runs against the real thing.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to test against
        required: true
        default: https://clyro.cloud
        type: string
      grep:
        description: Only run tests matching this (leave empty for all)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check the target is up
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          # A suite-wide timeout cascade is a miserable way to discover the box
          # is simply off. Say so in one line instead.
          API="${BASE_URL/:\/\//://api.}"
          if ! curl -fsS --max-time 20 "$API/api/health/" >/dev/null; then
            echo "::error::$API/api/health/ is not responding. If the instance is"
            echo "stopped, start it with the Infra Power workflow and re-run this."
            exit 1
          fi

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_REPO: ${{ secrets.E2E_TEST_REPO }}
          E2E_TEST_AWS_ROLE_ARN: ${{ secrets.E2E_TEST_AWS_ROLE_ARN }}
          E2E_EXPECT_GITHUB_INSTALLATION: ${{ secrets.E2E_EXPECT_GITHUB_INSTALLATION }}
        run: |
          ARGS="--reporter=list,html"
          if [ -n "${{ inputs.grep }}" ]; then
            ARGS="$ARGS -g '${{ inputs.grep }}'"
          fi
          eval npx playwright test $ARGS

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

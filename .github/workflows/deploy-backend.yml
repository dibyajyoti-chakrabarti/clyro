name: Deploy Backend

# Builds the Django image, pushes it to ECR, then asks the instance to pull and
# restart through SSM. No inbound port is opened and no SSH key exists: the
# deploy is a Systems Manager command, and the role that runs it can send that
# one document to that one instance and nothing else.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (defaults to the short SHA)
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: clyro-backend
  API_HEALTH_URL: https://api.clyro.cloud/

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, restart
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_SHA:0:7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve instance and registry
        id: infra
        run: |
          # Read from AWS rather than from repository secrets. A hardcoded
          # instance id went stale when the box was last replaced and broke the
          # scheduled shutdown silently for weeks.
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=clyro-prod-app" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "No running clyro-prod-app instance found" >&2
            exit 1
          fi
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "instance_id=$ID" >> "$GITHUB_OUTPUT"
          echo "registry=${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The instance is Graviton, so the image has to be arm64. GitHub's hosted
      # runners are x86, hence QEMU. It is slow (several minutes for a Python
      # dependency install), and the faster fix later is an arm64 runner rather
      # than dropping back to an x86 instance.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.infra.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ steps.infra.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # Layer cache in the registry itself, so a dependency install is not
          # repeated on every deploy that only changes application code.
          cache-from: type=registry,ref=${{ steps.infra.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.infra.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max

      # Reuses the same script cloud-init wrote and runs on first boot, so the
      # deploy path and the build-from-scratch path cannot drift apart.
      - name: Restart containers on the instance
        id: restart
        run: |
          CMD=$(aws ssm send-command \
            --instance-ids "${{ steps.infra.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --comment "deploy ${{ steps.tag.outputs.tag }}" \
            --parameters 'commands=["/opt/clyro/up.sh"]' \
            --query 'Command.CommandId' --output text)
          echo "Command: $CMD"
          aws ssm wait command-executed \
            --command-id "$CMD" \
            --instance-id "${{ steps.infra.outputs.instance_id }}" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "${{ steps.infra.outputs.instance_id }}" \
            --query Status --output text)
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "${{ steps.infra.outputs.instance_id }}" \
            --query StandardOutputContent --output text
          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command finished as $STATUS"
            aws ssm get-command-invocation --command-id "$CMD" \
              --instance-id "${{ steps.infra.outputs.instance_id }}" \
              --query StandardErrorContent --output text
            exit 1
          fi

      # A deploy that pushed an image and restarted a container it cannot reach
      # has not deployed anything. compose up returning 0 only means the
      # container started, not that Django is answering.
      - name: Wait for the API to answer
        run: |
          # 401, 403 and 404 all count as healthy: there is no health route,
          # every API view requires authentication, and any of them proves
          # Django routed the request.
          #
          # 400 explicitly does not. That is what Django returns for
          # DisallowedHost, so treating "any 4xx" as success would report a
          # green deploy for a box rejecting every single request. 5xx does not
          # count either.
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$API_HEALTH_URL" || echo 000)
            echo "attempt $i: $CODE"
            case "$CODE" in
              200|301|302|401|403|404) echo "API responding with $CODE"; exit 0 ;;
              400) echo "::error::400 from Django, usually ALLOWED_HOSTS not covering the request host"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::API never responded after 5 minutes"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backend deploy"
            echo
            echo "- Tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Instance: \`${{ steps.infra.outputs.instance_id }}\`"
            echo "- Endpoint: ${API_HEALTH_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag (defaults to short SHA)
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 321613317660.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: clyro-backend
  FUNCTION_NAME: clyro-prod-backend
  ECS_CLUSTER: clyro-prod-celery-cluster
  ECS_SERVICE: clyro-prod-celery-worker

jobs:
  deploy:
    name: Build, Push & Deploy to Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
            TAG="${TAG:0:7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $TAG"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Lambda image
        working-directory: backend
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build -f Dockerfile.lambda -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "✓ Pushed $IMAGE:$TAG"

      - name: Update Lambda function code
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.FUNCTION_NAME }}" \
            --image-uri "$IMAGE:$TAG" \
            --output json | jq '{FunctionName, LastUpdateStatus}'
          aws lambda wait function-updated --function-name "${{ env.FUNCTION_NAME }}"

      - name: Switch Lambda to migration handler
        run: |
          aws lambda update-function-configuration \
            --function-name "${{ env.FUNCTION_NAME }}" \
            --image-config '{"Command":["migrate_handler.handler"]}' \
            --output json | jq '{FunctionName, LastUpdateStatus}'
          aws lambda wait function-updated --function-name "${{ env.FUNCTION_NAME }}"

      - name: Run migrations
        run: |
          aws lambda invoke \
            --function-name "${{ env.FUNCTION_NAME }}" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/migrate-result.json
          cat /tmp/migrate-result.json
          if grep -q '"errorMessage"' /tmp/migrate-result.json; then
            echo "Migration invocation failed" >&2
            exit 1
          fi

      - name: Revert Lambda to API handler
        if: always()
        run: |
          aws lambda update-function-configuration \
            --function-name "${{ env.FUNCTION_NAME }}" \
            --image-config '{"Command":["lambda_handler.handler"]}' \
            --output json | jq '{FunctionName, LastUpdateStatus}'
          aws lambda wait function-updated --function-name "${{ env.FUNCTION_NAME }}"

      # The celery worker runs the SAME image as the Lambda but is deployed by
      # ECS, which had no step here at all — so it kept running whatever
      # `latest` pointed at when its task last started. It drifted to two weeks
      # behind the Lambda and started throwing
      #   KeyError: 'app.tasks.run_delete_project_task'
      # on tasks the newer Lambda enqueued. The task definition tracks the
      # mutable `latest` tag that the build step above just re-pushed, so
      # forcing a new deployment is all that's needed to pull the worker back
      # in step with the API.
      - name: Redeploy celery worker on the new image
        run: |
          DESIRED=$(aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].desiredCount' --output text)
          if [ "$DESIRED" = "0" ]; then
            echo "celery worker is scaled to 0 (outside the 9AM-9PM window) — "
            echo "skipping force-deploy; it will start on the new image at 9AM."
            exit 0
          fi
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --query 'service.{name:serviceName,desired:desiredCount}'
          echo "Waiting for the worker to reach steady state…"
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}"
          echo "✓ celery worker redeployed"

      - name: Verify deployed image
        run: |
          aws lambda get-function --function-name "${{ env.FUNCTION_NAME }}" \
            --query 'Code.ImageUri' --output text
          aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].{desired:desiredCount,running:runningCount,taskDef:taskDefinition}'

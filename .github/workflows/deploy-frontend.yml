name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: prod
        type: choice
        options: [prod]

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: clyro-prod-frontend
  CF_DISTRIBUTION_ID: EADKB0A4SBAJA
  # Non-secret Vite config — already public in .env.example
  VITE_COGNITO_USER_POOL_ID: ap-south-1_RHY9si02J
  VITE_COGNITO_CLIENT_ID: 6vn4pdd2m2pigk854dkjapgf8t
  VITE_COGNITO_REGION: ap-south-1
  VITE_COGNITO_DOMAIN: clyro.auth.ap-south-1.amazoncognito.com
  VITE_API_BASE_URL: https://api.clyro.cloud
  VITE_APP_URL: https://clyro.cloud
  VITE_GITHUB_APP_NAME: crylo-github

jobs:
  deploy:
    name: Build & Deploy to S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          # index.html must never be cached
          aws s3 cp frontend/dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CF_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query Invalidation.Id \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ env.CF_DISTRIBUTION_ID }} \
            --id "$INVALIDATION_ID"
          echo "✓ CloudFront cache cleared"

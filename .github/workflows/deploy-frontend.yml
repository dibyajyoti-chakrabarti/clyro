name: Deploy Frontend

# Builds a frontend bundle, syncs it to S3, invalidates CloudFront, and then
# proves the bundle actually reached the edge.
#
# One workflow with a matrix, replacing two near-identical files. Both had
# drifted: they named buckets without the account-id suffix, CloudFront
# distribution ids from an account that no longer exists, a Cognito pool from
# that same account, and a role secret that has since been deleted. Nothing
# here is hardcoded that AWS can be asked for instead.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'frontend-admin/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      app:
        description: Which bundle to deploy
        required: true
        default: both
        type: choice
        options: [both, frontend, frontend-admin]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

concurrency:
  group: deploy-frontend-${{ github.event.inputs.app || 'both' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    environment: prod

    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend-admin]

    steps:
      - name: Skip if this app was not selected
        id: gate
        run: |
          WANTED="${{ github.event.inputs.app || 'both' }}"
          if [ "$WANTED" = "both" ] || [ "$WANTED" = "${{ matrix.app }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not selected, skipping."
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Everything the build and the deploy need, read from AWS at run time.
      # The previous workflows pasted pool ids and distribution ids into the
      # file, and every one of them was stale within a month.
      # Read from SSM, which Terraform populates. Nothing is hardcoded, and
      # nothing needs a permission this role should not have: an earlier
      # version located the distribution with cloudfront:ListDistributions,
      # which cannot be scoped to a resource and would have let this role
      # enumerate every distribution in an account shared with two other
      # products.
      - name: Resolve configuration
        if: steps.gate.outputs.run == 'true'
        id: cfg
        run: |
          set -euo pipefail
          get() {
            aws ssm get-parameter --name "$1" --query Parameter.Value --output text
          }
          # Optional values: absent or still a placeholder is not an error here.
          soft() {
            v=$(aws ssm get-parameter --name "$1" --query Parameter.Value --output text 2>/dev/null || echo "")
            [ "$v" = "PENDING" ] && v=""
            echo "$v"
          }
          APP=${{ matrix.app }}
          {
            echo "bucket=$(get "/clyro/prod/$APP/bucket")"
            echo "dist=$(get "/clyro/prod/$APP/distribution_id")"
            echo "host=$(get "/clyro/prod/$APP/host")"
            echo "pool=$(soft /clyro/prod/env/COGNITO_USER_POOL_ID)"
            echo "client=$(soft /clyro/prod/env/COGNITO_CLIENT_ID)"
            echo "cognito_domain=$(soft /clyro/prod/env/COGNITO_DOMAIN)"
            echo "api=$(get /clyro/prod/api/base_url)"
            echo "app_url=$(get /clyro/prod/app/url)"
            echo "gh_app=$(soft /clyro/prod/env/GITHUB_APP_NAME)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ matrix.app }}
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ steps.cfg.outputs.pool }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.cfg.outputs.client }}
          VITE_COGNITO_REGION: ${{ env.AWS_REGION }}
          VITE_COGNITO_DOMAIN: ${{ steps.cfg.outputs.cognito_domain }}
          VITE_API_BASE_URL: ${{ steps.cfg.outputs.api }}
          VITE_APP_URL: ${{ steps.cfg.outputs.app_url }}
          VITE_GITHUB_APP_NAME: ${{ steps.cfg.outputs.gh_app }}
        run: npm run build

      # Hashed assets first with a long max-age, then index.html last with
      # no-cache. In that order a browser can never fetch a new index.html that
      # references assets which have not landed yet.
      - name: Sync to S3
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ matrix.app }}
        run: |
          set -euo pipefail
          aws s3 sync dist/ "s3://${{ steps.cfg.outputs.bucket }}/" \
            --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ steps.cfg.outputs.bucket }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cfg.outputs.dist }}" \
            --paths '/*' --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.cfg.outputs.dist }}" --id "$ID"

      # A status code proves nothing here. The distribution rewrites both 403
      # and 404 to /index.html with a 200 so that client-side routing works,
      # which means a completely empty bucket and a totally broken deploy both
      # answer 200. Comparing the served index.html against the one just built
      # is the only check that actually distinguishes them.
      - name: Verify the bundle actually reached the edge
        if: steps.gate.outputs.run == 'true'
        working-directory: ${{ matrix.app }}
        run: |
          set -euo pipefail
          LOCAL=$(sha256sum dist/index.html | cut -d' ' -f1)
          for i in $(seq 1 10); do
            REMOTE=$(curl -fsS "https://${{ steps.cfg.outputs.host }}/index.html" \
              | sha256sum | cut -d' ' -f1) || REMOTE=""
            if [ "$REMOTE" = "$LOCAL" ]; then
              echo "Served index.html matches the build ($LOCAL)"
              exit 0
            fi
            echo "attempt $i: served $REMOTE, expected $LOCAL"
            sleep 10
          done
          echo "::error::https://${{ steps.cfg.outputs.host }}/ is not serving the bundle just built"
          exit 1

      - name: Summary
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          {
            echo "### ${{ matrix.app }}"
            echo
            echo "- Bucket: \`${{ steps.cfg.outputs.bucket }}\`"
            echo "- Distribution: \`${{ steps.cfg.outputs.dist }}\`"
            echo "- URL: https://${{ steps.cfg.outputs.host }}/"
          } >> "$GITHUB_STEP_SUMMARY"

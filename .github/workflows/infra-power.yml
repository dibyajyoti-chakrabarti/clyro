name: Infra Power

# Starts and stops the one EC2 box, on request only.
#
# This used to run on a 09:00 / 21:00 IST cron. The schedule is gone: a box
# that stops itself overnight kept ending demos and test runs midway, and
# nobody could tell a deliberate shutdown from a failure. Power is now an
# explicit act, so the box stays exactly as it was last left.
#
# The instance is resolved by tag, never from a repository secret. A hardcoded
# EC2_INSTANCE_ID went stale when the box was replaced and broke the nightly
# shutdown silently for weeks.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        default: start
        type: choice
        options: [start, stop]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  INSTANCE_NAME: clyro-prod-app

concurrency:
  group: infra-power
  cancel-in-progress: false

jobs:
  toggle:
    name: Start or stop the instance
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Toggle
        run: |
          set -euo pipefail
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_NAME}" \
                      "Name=instance-state-name,Values=running,stopped,stopping,pending" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "::error::No instance tagged Name=${INSTANCE_NAME}"
            exit 1
          fi

          STATE=$(aws ec2 describe-instances --instance-ids "$ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "$ID is currently $STATE"

          # Both calls are idempotent, but skipping the no-op keeps the log
          # honest about whether anything actually changed.
          case "${{ inputs.action }}:$STATE" in
            start:running) echo "Already running, nothing to do" ;;
            stop:stopped)  echo "Already stopped, nothing to do" ;;
            start:*)       aws ec2 start-instances --instance-ids "$ID" >/dev/null
                           echo "Starting; the Elastic IP reattaches on its own, so DNS does not change" ;;
            stop:*)        aws ec2 stop-instances --instance-ids "$ID" >/dev/null
                           echo "Stopping" ;;
          esac

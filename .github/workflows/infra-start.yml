name: Manual - Start Infra

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  RDS_INSTANCE: clyro-prod-rds

jobs:
  start:
    name: Start RDS and NAT instance
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start RDS if stopped
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.RDS_INSTANCE }} \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text)
          echo "Current RDS status: $STATUS"
          if [ "$STATUS" = "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier ${{ env.RDS_INSTANCE }}
            echo "Waiting for RDS to become available…"
            aws rds wait db-instance-available --db-instance-identifier ${{ env.RDS_INSTANCE }}
            echo "✓ RDS available"
          else
            echo "RDS is not stopped — skipping (status: $STATUS)"
          fi

      - name: Start NAT instance if stopped
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          echo "Current NAT instance state: $STATE"
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
            echo "✓ NAT instance start initiated"
          else
            echo "NAT instance is not stopped — skipping (state: $STATE)"
          fi

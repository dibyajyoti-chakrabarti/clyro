AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Clyro bootstrap — creates a cross-account IAM role that allows Clyro to
  provision infrastructure in your AWS account. You can delete this role at any
  time to immediately revoke Clyro's access.

Parameters:
  ClyroAccountId:
    Type: String
    Description: The Clyro AWS account ID that will assume this role
  ExternalId:
    Type: String
    Description: Unique identifier for this Clyro project connection (do not change)

# [NOTE — disclosed trade-off, not a defect] EC2 (VPC/subnets/SGs/NAT/routes), ECS,
# application-autoscaling, ECR, RDS, ElastiCache, ELB, ACM, Route53, and CloudFront
# actions below are granted with Resource: '*'. These AWS APIs have no meaningful
# ARN-level resource scoping for the create/describe actions used here (e.g.
# ec2:CreateVpc, rds:CreateDBInstance take no resource ARN at call time — the
# resource doesn't exist yet), so '*' is the only workable grant, not an oversight.
# IAM, Secrets Manager, S3, SQS, and Logs actions below ARE scoped to
# clyro-*-prefixed resources (see the per-statement comments), since those AWS APIs
# do support resource-level ARN conditions and the IacArchitect authoring rules
# require these four resource types specifically (IAM roles, S3 buckets, SQS queues,
# log groups) to use build_spec.py's iam_scoped_prefix, which always starts with
# "clyro-". Every OTHER resource type (ALB, Target Groups, ECS, RDS, ElastiCache) uses
# the shorter naming_prefix instead — several of those have tight AWS name-length
# limits (e.g. ALB/Target Group names cap at 32 chars) that a "clyro-"-prefixed name
# routinely exceeds, which is exactly why those actions above stay Resource: "*".
Resources:
  ClyroProvisioningRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'clyro-provisioning-${ExternalId}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${ClyroAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: ClyroProvisioningPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Networking — VPC, subnets, security groups, gateways, route tables
              - Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:DescribeVpcs
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:DescribeSubnets
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:DescribeInternetGateways
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:CreateNatGateway
                  - ec2:DeleteNatGateway
                  - ec2:DescribeNatGateways
                  - ec2:AllocateAddress
                  - ec2:ReleaseAddress
                  - ec2:DescribeAddresses
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:DescribeRouteTables
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:DescribeSecurityGroups
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeAccountAttributes
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:DescribeTags
                  # Found live: ALB creation calls this internally to resolve the
                  # security groups attached to the target VPC — missing entirely,
                  # so ApplicationLoadBalancer creation failed with AccessDenied
                  # despite every other ec2:Describe* action already being granted.
                  - ec2:GetSecurityGroupsForVpc
                Resource: '*'
              # Container compute — ECS clusters, services, task definitions
              - Effect: Allow
                Action:
                  - ecs:CreateCluster
                  - ecs:DeleteCluster
                  - ecs:DescribeClusters
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:CreateService
                  - ecs:DeleteService
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:ListTaskDefinitions
                  - ecs:TagResource
                  - ecs:UntagResource
                Resource: '*'
              # Container autoscaling
              - Effect: Allow
                Action:
                  - application-autoscaling:RegisterScalableTarget
                  - application-autoscaling:DeregisterScalableTarget
                  - application-autoscaling:DescribeScalableTargets
                  - application-autoscaling:PutScalingPolicy
                  - application-autoscaling:DeleteScalingPolicy
                  - application-autoscaling:DescribeScalingPolicies
                Resource: '*'
              # Container registry — repo management AND image push. Found live:
              # only repo management was ever granted, so every deployment's
              # ECR repos were created empty and ECS retried
              # CannotPullContainerError forever — nothing could ever push an
              # image, even with a working build step. GetAuthorizationToken
              # has no resource-level scoping in AWS's own IAM model (same
              # class of action as secretsmanager:GetRandomPassword above).
              - Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:SetRepositoryPolicy
                  - ecr:GetRepositoryPolicy
                  - ecr:DeleteRepositoryPolicy
                  - ecr:PutLifecyclePolicy
                  - ecr:GetLifecyclePolicy
                  - ecr:TagResource
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource: '*'
              # CodeBuild — the build step that gets a customer's application
              # code into the ECR repos / S3 bucket the generated template
              # creates (see backend/app/provisioning/codebuild_spec.py). Its
              # own service role is named clyro-<prefix>-<node>-codebuild, so
              # the existing IAM statement below (arn:...role/clyro-*, already
              # covering CreateRole/PassRole) already grants what CodeBuild's
              # role itself needs — no separate PassRole statement here.
              # CodeBuild's default log group (/aws/codebuild/<project-name>)
              # also falls under the existing *clyro-* Logs wildcard below,
              # since the project name itself contains "clyro-".
              - Effect: Allow
                Action:
                  - codebuild:CreateProject
                  - codebuild:DeleteProject
                  - codebuild:UpdateProject
                  - codebuild:BatchGetProjects
                  - codebuild:StartBuild
                  - codebuild:StopBuild
                  - codebuild:BatchGetBuilds
                  - codebuild:ListBuildsForProject
                Resource: !Sub 'arn:aws:codebuild:*:${AWS::AccountId}:project/clyro-*'
              # Database — RDS instances and Aurora clusters
              - Effect: Allow
                Action:
                  - rds:CreateDBInstance
                  - rds:DeleteDBInstance
                  - rds:DescribeDBInstances
                  - rds:ModifyDBInstance
                  - rds:CreateDBCluster
                  - rds:DeleteDBCluster
                  - rds:DescribeDBClusters
                  - rds:ModifyDBCluster
                  - rds:CreateDBSubnetGroup
                  - rds:DeleteDBSubnetGroup
                  - rds:DescribeDBSubnetGroups
                  - rds:CreateDBParameterGroup
                  - rds:DeleteDBParameterGroup
                  - rds:DescribeDBParameterGroups
                  - rds:ModifyDBParameterGroup
                  - rds:CreateDBClusterParameterGroup
                  - rds:DeleteDBClusterParameterGroup
                  - rds:DescribeDBClusterParameterGroups
                  - rds:AddTagsToResource
                  - rds:RemoveTagsFromResource
                  - rds:ListTagsForResource
                  # Found live: same shape as the ElastiCache CreateSnapshot gap —
                  # DeleteDBInstance takes a final snapshot unless explicitly
                  # skipped, requiring this even though DeleteDBInstance itself is
                  # already granted.
                  - rds:CreateDBSnapshot
                  - rds:DeleteDBSnapshot
                  - rds:DescribeDBSnapshots
                Resource: '*'
              # Cache — ElastiCache clusters
              - Effect: Allow
                Action:
                  - elasticache:CreateCacheCluster
                  - elasticache:DeleteCacheCluster
                  - elasticache:DescribeCacheClusters
                  - elasticache:ModifyCacheCluster
                  - elasticache:CreateReplicationGroup
                  - elasticache:DeleteReplicationGroup
                  - elasticache:DescribeReplicationGroups
                  - elasticache:ModifyReplicationGroup
                  - elasticache:CreateCacheSubnetGroup
                  - elasticache:DeleteCacheSubnetGroup
                  - elasticache:DescribeCacheSubnetGroups
                  - elasticache:CreateCacheParameterGroup
                  - elasticache:DeleteCacheParameterGroup
                  - elasticache:DescribeCacheParameterGroups
                  - elasticache:AddTagsToResource
                  - elasticache:RemoveTagsFromResource
                  - elasticache:ListTagsForResource
                  # Found live: a replication group with SnapshotRetentionLimit > 0
                  # takes a final snapshot on delete regardless of the CFN
                  # DeletionPolicy — without this, DeleteReplicationGroup itself
                  # fails with AccessDenied, leaving the stack DELETE_FAILED.
                  - elasticache:CreateSnapshot
                  - elasticache:DeleteSnapshot
                  - elasticache:DescribeSnapshots
                Resource: '*'
              # Found live (twice, for two different services): the FIRST time a
              # given AWS service is used in an account, it needs its own service-
              # linked role, which the service creates on your behalf on first use —
              # but doing so requires the caller to hold iam:CreateServiceLinkedRole
              # for that specific role. Without it, e.g. CreateReplicationGroup or
              # ApplicationLoadBalancer creation fails with "insufficient
              # permissions... create new role using IAM API
              # CreateServiceLinkedRole" even though every other service-specific
              # action is already granted. Granting all the services this pipeline
              # actually provisions up front, rather than hitting each one in a
              # separate live failure.
              - Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource:
                  - 'arn:aws:iam::*:role/aws-service-role/elasticache.amazonaws.com/AWSServiceRoleForElastiCache'
                  - 'arn:aws:iam::*:role/aws-service-role/elasticloadbalancing.amazonaws.com/AWSServiceRoleForElasticLoadBalancing'
                  - 'arn:aws:iam::*:role/aws-service-role/ecs.amazonaws.com/AWSServiceRoleForECS'
                  - 'arn:aws:iam::*:role/aws-service-role/rds.amazonaws.com/AWSServiceRoleForRDS'
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - elasticache.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - ecs.amazonaws.com
                      - rds.amazonaws.com
              # Load balancing — ALB, target groups, listeners
              - Effect: Allow
                Action:
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:ModifyLoadBalancerAttributes
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:ModifyTargetGroup
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:ModifyListener
                  - elasticloadbalancing:CreateRule
                  - elasticloadbalancing:DeleteRule
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:RemoveTags
                  - elasticloadbalancing:DescribeTags
                  # Found live: a CloudWatch Alarm on ALB target group response
                  # time calls these internally to resolve the target group's full
                  # name for the metric dimension.
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeTargetGroupAttributes
                Resource: '*'
              # TLS certificates
              - Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DeleteCertificate
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                  - acm:AddTagsToCertificate
                  - acm:RemoveTagsFromCertificate
                Resource: '*'
              # DNS validation for ACM certificates
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:ListHostedZones
                  - route53:GetChange
                  - route53:ListResourceRecordSets
                Resource: '*'
              # Secrets storage — two DIFFERENT naming conventions both need to match
              # here: write_secret() (backend/app/provisioning/aws_client.py, Step 4
              # user-supplied env vars) names secrets `clyro/{project_slug}/{key}`
              # (slash-style); CloudFormation-created secrets (e.g. the RDS master
              # password, using build_spec.py's iam_scoped_prefix) name them
              # `clyro-{project}-{env}/...` (hyphen-style). Found live: only the
              # slash pattern was granted, so every template-created secret failed
              # with AccessDenied on CreateSecret at real deploy time.
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource:
                  - !Sub 'arn:aws:secretsmanager:*:${AWS::AccountId}:secret:clyro/*'
                  - !Sub 'arn:aws:secretsmanager:*:${AWS::AccountId}:secret:clyro-*'
              # GetRandomPassword is a stateless utility call (not tied to any secret
              # ARN — AWS does not support resource-level scoping for it at all), needed
              # by every AWS::SecretsManager::Secret using GenerateSecretString (e.g. the
              # RDS master password). Found live: templates without this grant fail at
              # deploy time with "not authorized to perform: secretsmanager:
              # GetRandomPassword" on DbSecret, immediately cascading into a full
              # rollback.
              - Effect: Allow
                Action:
                  - secretsmanager:GetRandomPassword
                Resource: '*'
              # CloudWatch logs for ECS tasks and RDS — scoped to clyro-* named log groups
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:CreateLogStream
                  - logs:DeleteLogStream
                  - logs:DescribeLogStreams
                  - logs:TagLogGroup
                  - logs:TagResource
                Resource:
                  - !Sub 'arn:aws:logs:*:${AWS::AccountId}:log-group:*clyro-*'
                  - !Sub 'arn:aws:logs:*:${AWS::AccountId}:log-group:*clyro-*:*'
              # Found live: an entire missing category — the generated template
              # consistently creates CloudWatch Alarms (backend service running
              # count, RDS CPU/storage, ElastiCache evictions, SQS message age,
              # ALB 5xx) but bootstrap.yaml never granted cloudwatch:* at all.
              # Alarms are named from NamingPrefix (e.g. "taskboard-staging-..."),
              # not IamScopedPrefix — unlike log groups, there's no "clyro-"
              # substring to scope on, so this is Resource: '*' like the other
              # non-clyro-prefixed services (RDS, ALB, ElastiCache) above.
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: '*'
              # S3 — static frontend assets and CF template staging — scoped to clyro-* buckets
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketAcl
                  - s3:PutBucketAcl
                  - s3:GetBucketCORS
                  - s3:PutBucketCORS
                  - s3:GetBucketWebsite
                  - s3:PutBucketWebsite
                  - s3:DeleteBucketWebsite
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObjectAcl
                  - s3:PutObjectAcl
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  # Found live: BuildArchiveBucket's LifecycleConfiguration
                  # (auto-expiring staged build archives after 7 days) needs
                  # this — missing entirely, so the bucket itself failed to
                  # create with AccessDenied.
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                  # Found live: missing entirely, so every FrontendBucket with
                  # BucketEncryption failed at deploy time with AccessDenied.
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  # Some generated buckets also set OwnershipControls — grant it
                  # proactively rather than wait for the next live failure.
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketOwnershipControls
                Resource:
                  - 'arn:aws:s3:::clyro-*'
                  - 'arn:aws:s3:::clyro-*/*'
              # CloudFront for static frontends
              - Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:CreateCloudFrontOriginAccessIdentity
                  - cloudfront:DeleteCloudFrontOriginAccessIdentity
                  - cloudfront:GetCloudFrontOriginAccessIdentity
                  - cloudfront:TagResource
                Resource: '*'
              # SQS for task queues (Celery) — scoped to clyro-* named queues.
              # ListQueues has no resource-level permissions in IAM (AWS requires '*'
              # for it specifically) — every other action here is ARN-scoped.
              - Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource: !Sub 'arn:aws:sqs:*:${AWS::AccountId}:clyro-*'
              - Effect: Allow
                Action:
                  - sqs:ListQueues
                Resource: '*'
              # CloudFormation — create/update/delete the app stack this role provisions,
              # scoped to clyro-* named stacks; describe/validate need no resource scoping.
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                Resource: !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/clyro-*/*'
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                Resource: '*'
              # IAM — scoped to clyro-managed roles only (ECS task/execution roles)
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:ListRoles
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - !Sub 'arn:aws:iam::*:role/clyro-*'
                  - !Sub 'arn:aws:iam::*:instance-profile/clyro-*'
      Tags:
        - Key: ManagedBy
          Value: Clyro
        - Key: ExternalId
          Value: !Ref ExternalId

Outputs:
  RoleArn:
    Description: Paste this ARN into Clyro to complete the connection
    Value: !GetAtt ClyroProvisioningRole.Arn
  ExternalId:
    Description: The external ID for this connection (for your records)
    Value: !Ref ExternalId

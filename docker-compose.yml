version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: clyro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clyro
      POSTGRES_PASSWORD: clyro
      POSTGRES_DB: clyro_db
    ports:
      - "5432:5432"
    volumes:
      - clyro_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clyro -d clyro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clyro_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: clyro_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://clyro:clyro@db:5432/clyro_db
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    env_file:
      - ./backend/.env.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/venv
      # Local dev: give the container the host's AWS creds (for Bedrock AgentCore
      # and cross-account assume-role). Relative path (host ~/.aws, two levels up
      # from this compose dir) rather than ${HOME}/.aws: under Docker Desktop's
      # WSL interop, compose interpolation runs on the Windows side where $HOME is
      # empty, so ${HOME} yields an empty mount and an absolute /home/... is read
      # inside the Docker VM (also empty). A compose-relative path resolves
      # against the WSL project dir correctly, same as ./backend above.
      - ../../.aws:/root/.aws:ro

  celery_worker:
    build: ./backend
    container_name: clyro_celery_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://clyro:clyro@db:5432/clyro_db
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    env_file:
      - ./backend/.env.local
    command: celery -A config worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/venv
      - ../../.aws:/root/.aws:ro

  celery_beat:
    build: ./backend
    container_name: clyro_celery_beat
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://clyro:clyro@db:5432/clyro_db
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    env_file:
      - ./backend/.env.local
    # Drives CELERY_BEAT_SCHEDULE (config/settings.py) — currently just the
    # AWS-state reconciliation sweep (app.provisioning.reconcile). In prod
    # this runs as a second process on the same Celery worker service
    # (infrastructure/modules/celery_worker/), not a separate always-on task.
    command: celery -A config beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/venv
      - ../../.aws:/root/.aws:ro

  frontend:
    build: ./frontend
    container_name: clyro_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keep the image's node_modules (don't shadow with host)
    # Install deps on start so package.json changes are picked up without a rebuild.
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

  # Separate app, separate port — admin credentials/token never share an origin
  # (and never share a JS bundle) with the Cognito-backed user frontend above.
  frontend_admin:
    build: ./frontend-admin
    container_name: clyro_frontend_admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  clyro_db_data:

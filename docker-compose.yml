version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: clyro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clyro
      POSTGRES_PASSWORD: clyro
      POSTGRES_DB: clyro_db
    ports:
      - "5432:5432"
    volumes:
      - clyro_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clyro -d clyro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: clyro_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://clyro:clyro@db:5432/clyro_db
    env_file:
      - ./backend/.env.local
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/venv

  frontend:
    build: ./frontend
    container_name: clyro_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  clyro_db_data:
